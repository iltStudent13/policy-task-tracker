services:
  mongo:
    image: mongo:7
    container_name: ptt-mongo
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  api:
    build: ./api
    container_name: ptt-api
    environment:
      MONGO_URI: mongodb://mongo:27017/policy-task-tracker
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3000
    depends_on:
      - mongo
    restart: unless-stopped
  
  client:
    build: ./client
    container_name: ptt-client
    ports:
      - "8443:443"
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: client:latest
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: task-tracker-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: task-tracker
spec:
  type: NodePort
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: task-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: 084375570942.dkr.ecr.us-east-1.amazonaws.com/capstone-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: task-tracker-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: task-tracker
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
